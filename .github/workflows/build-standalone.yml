name: Build, Push and Deploy to Docker Swarm

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js application
        run: npm run build

      - name: Bundle public and static assets
        run: |
          cp -r ./public ./.next/standalone/public
          cp -r ./.next/static ./.next/standalone/.next/static
          cp Dockerfile ./.next/standalone/Dockerfile

      - name: Upload Standalone Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone-build
          path: ./.next/standalone
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Build, Push and Swarm Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем исходный код репозитория ради docker-compose.yml
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Скачиваем скомпилированный артефакт Next.js для сборки Docker-образа
      - name: Download Standalone Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-standalone-build
          path: ./build-context

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,priority=1000
            type=raw,value=latest

      # В контекст сборки передаем папку ./build-context, где лежит артефакт и Dockerfile
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./build-context
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 3. Подключаемся по SSH и запускаем деплой
      - name: Deploy to Docker Swarm via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_PASS
          script: |
            # Авторизация в GHCR на сервере
            echo "$REGISTRY_PASS" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

            # Переходим в папку со скопированным compose-файлом
            cd /opt/stack-studio

            echo "IMAGE_TAG: " $IMAGE_TAG

            # Запускаем деплой стека
            IMAGE_TAG=$IMAGE_TAG docker stack deploy --with-registry-auth -c docker-stack.yaml stack-studio --prune
